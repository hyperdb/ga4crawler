name = "ga4crawler"
main = "src/index.ts"
compatibility_date = "2026-11-16"

[triggers]
# 環境に応じて変更 - 毎日深夜3時に自動実行（UTC 18:00 = JST 03:00）
crons = ["0 18 * * *"]

[vars]
# 監視対象のサイト一覧（複数の場合はカンマ区切りで並べる）
SITES_CONFIG = '[{"name": "site name", "propertyId": "property id"}]'

# D1 データベースのバインド設定
[[d1_databases]]
binding = "DB"
# 環境に応じて変更
database_name = "ga4-stats-db"
database_id = "your database id"